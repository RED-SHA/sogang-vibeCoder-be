spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/kmedtour
    username: ${DB_USERNAME:kmedtour}
    password: ${DB_PASSWORD:kmedtour}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: localhost
      port: 6379

  jpa:
    show-sql: true

logging:
  level:
    com.k.medtour: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
